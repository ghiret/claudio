name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          additional_files: 'install.sh'

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            docs/*.md

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'

  validate-install:
    name: Validate Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: bash -n install.sh

      - name: Check scripts syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Verify version consistency
        run: |
          INSTALL_VERSION=$(grep -oP 'VERSION="\K[^"]+' install.sh)
          MANIFEST_VERSION=$(grep -oP '"\.":\s*"\K[^"]+' .release-please-manifest.json)
          if [ "$INSTALL_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: install.sh=$INSTALL_VERSION, manifest=$MANIFEST_VERSION"
            exit 1
          fi
          echo "Versions match: $INSTALL_VERSION"
